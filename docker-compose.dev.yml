services:
  postgres:
    build: ./docker/postgres
    command: postgres -c shared_preload_libraries=pg_stat_statements,pg_cron -c cron.database_name=FormHandler
    environment:
      POSTGRES_DB: FormHandler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    entrypoint: /bin/sh -c "cp /pgpass-src /tmp/pgpass && chmod 600 /tmp/pgpass && /entrypoint.sh"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass-src:ro

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5010:80"
      - "2525:25"

volumes:
  postgres_dev_data:
  pgadmin_data:
